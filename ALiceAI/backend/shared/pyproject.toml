[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aliceai-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["redis>=8.1.0"]

[tool.setuptools]
packages = ["aliceai_shared", "aliceai_shared.redis"]
package-dir = { aliceai_shared = "app" }
