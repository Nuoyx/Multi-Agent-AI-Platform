name: aliceai

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aliceai
      POSTGRES_USER: aliceai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./ALiceAI/backend/db/init_databases.sql
        target: /docker-entrypoint-initdb.d/001_init_databases.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ALiceAI/backend/services/auth/db/create_users.sql
        target: /opt/aliceai/create_users.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aliceai", "-d", "aliceai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
